name: Notebook integrity

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Validate notebook JSON and code-cell syntax
        run: python -m pytest -q
