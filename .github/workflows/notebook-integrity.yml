name: Reproducible model checks and outputs

on:
  push:
    branches: [refactor/otc-margining-layout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/otc-margining-layout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run model tests
        run: python -m pytest -q
      - name: Regenerate simulation tables and charts
        run: python run_analysis.py
      - name: Commit reproducible outputs to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures outputs
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate simulation figures and tables [skip ci]"
            git push
          fi
