name: Reproducible model checks and outputs

on:
  push:
    branches:
      - refactor/otc-margining-layout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: refactor/otc-margining-layout
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and repository checks
        run: python -m pytest -q
      - name: Regenerate simulation tables and figures
        run: python run_analysis.py
      - name: Build the five-page technical summary
        run: python build_report.py
      - name: Commit generated charts, tables and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures outputs docs/OTC_Margining_Technical_Summary.pdf
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate simulation figures and tables [skip ci]"
            git push
          fi
